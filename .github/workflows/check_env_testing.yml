name: Run Python Script

on:
  push:
    branches:
#      - main
#      - master
      - '**'   # run on all branches (optional)

jobs:
  docker-flask:
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check database password configuration
        env:
          DB_PASSWORD: ${{ vars.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD is empty or unavailable."
            exit 1
          fi
          echo "DB_PASSWORD is available."