name: Flask API Tests

on:
  push:
    branches:
#      - main
#      - master
      - '**'   # run on all branches (optional)
  pull_request:

jobs:
  api-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r py_web/py_web_server_flask/pytest_api_py_web_flask_01basic/requirements.txt

      - name: Run API tests
        run: |
          cd py_web/py_web_server_flask/pytest_api_py_web_flask_01basic
          pytest