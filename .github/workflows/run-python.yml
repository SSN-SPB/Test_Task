name: Run Python Script

on:
  push:
    branches:
#      - main
#      - master
      - '**'   # run on all branches (optional)

jobs:
  code-style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install code style tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Flake8
        run: |
          flake8 ./Py_functionality_libs/py_functions --ignore=E501,E203

      - name: Check Black formatting
        run: |
          black --check ./Py_functionality_libs/py_functions

      - name: Check import sorting
        run: |
          isort --check-only ./Py_functionality_libs/py_functions
          

  run-python:
    runs-on: ubuntu-latest
    needs: code-style  # It will not be performed if code-style fails

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Inform about commit
        run: |
          python commit_script_run.py

      - name: Run Python script
        run: |
          python ./Py_functionality_libs/py_functions/py_func_06_lambda_02_lambda_filter_02parameter.py

      - name: Complete test run
        run: |
          python simple_script_run.py