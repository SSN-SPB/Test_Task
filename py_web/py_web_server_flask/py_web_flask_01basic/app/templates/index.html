<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask Training - Login</title>
</head>

<body>

<h1>Flask Training Application</h1>

<h2>Login</h2>

<form action="/login" method="POST">

    <div>
        <label for="username">Name:</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your name"
        >
    </div>

    <br>

    <div>
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
        >
    </div>

    <br>

    <button type="submit">Login</button>

</form>

{% if error %}
    <p id="login-error">{{ error }}</p>
{% endif %}

<hr>

<h3>Test credentials</h3>

<p>
    <strong>Name:</strong> Admin
</p>

<p>
    <strong>Password:</strong> Pass123!
</p>

</body>
</html>
